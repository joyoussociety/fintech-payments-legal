<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Fintech Payments Authorization</title>
</head>
<body>
    <h2>Fintech Payments</h2>
    <p id="status">Checking authorization...</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const response = new URLSearchParams();

        history.replaceState(null, "", window.location.pathname);

        const valid = params.has("state") &&
            ((params.has("code") && params.has("realmId")) ||
             params.has("error"));

        if (valid) {
            for (const key of ["code", "state", "realmId", "error"]) {
                if (params.has(key)) {
                    response.set(key, params.get(key));
                }
            }

            window.location.replace(
                "http://localhost:8000/callback?" +
                response.toString()
            );
        } else {
            document.getElementById("status").textContent =
                "Please connect through the Fintech Payments application.";
        }
    </script>
</body>
</html>
